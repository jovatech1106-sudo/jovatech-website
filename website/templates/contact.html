{% extends 'base.html' %}
{% block title %}
Contact Us | JOVATECH COMPUTER TECHNOLOGIES
{% endblock %}
{% block content %}
<section class="contact reveal">
    <h2>Contact JOVATECH COMPUTER TECHNOLOGIES</h2>
    <p>
        We'd love to hear from you. Send us a message below.
    </p>
    {% if success %}
    <div class="success-message">
        {( success )}
    </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="text"
               name="name"
               placeholder="Full Name"
               required>
        <input type="email"
               name="email"
               placeholder="Email Address"
               required>
        <input type="text"
               name="subject"
               placeholder="Subject"
               required>
        <textarea
            name="message"
            rows="6"
            placeholder="Write your message..."
            required></textarea>
        <button type="submit">
            Send Message
        </button>
    </form>
</section>
{% endblock %}
